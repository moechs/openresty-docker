name: Docker Image CI

on:
  push:
    tags:        
    - v*
    paths-ignore:
    - '**.md'

permissions:
  contents: read

concurrency:
  group: 'docker-openresty-${{ github.ref }}'
  cancel-in-progress: false

env:
  MAIN_IMAGE: moechs/openresty
  BACKEND_IMAGE: moechs/defaultbackend
  META_TAGS: |
    type=ref,event=branch
    type=match,pattern=v(.*),group=1

jobs:
  build-main:
    name: 'openresty / ${{ matrix.arch }}'
    runs-on: '${{ matrix.runner }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: '${{ env.MAIN_IMAGE }}'
          tags: '${{ env.META_TAGS }}'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: 'linux/${{ matrix.arch }}'
          labels: '${{ steps.meta.outputs.labels }}'
          provenance: false
          outputs: 'type=image,name=${{ env.MAIN_IMAGE }},push-by-digest=true,name-canonical=true,push=true'
          cache-from: 'type=gha,scope=openresty-${{ matrix.arch }}'
          cache-to: 'type=gha,mode=max,scope=openresty-${{ matrix.arch }}'
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: 'digests-main-${{ matrix.arch }}'
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-main:
    needs: build-main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: 'digests-main-*'
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'
      - uses: docker/metadata-action@v5
        with:
          images: '${{ env.MAIN_IMAGE }}'
          tags: '${{ env.META_TAGS }}'
      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${MAIN_IMAGE}@sha256:%s " *)

  build-defaultbackend:
    name: 'defaultbackend / ${{ matrix.arch }}'
    needs: merge-main
    runs-on: '${{ matrix.runner }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: '${{ env.BACKEND_IMAGE }}'
          tags: '${{ env.META_TAGS }}'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: defaultbackend
          platforms: 'linux/${{ matrix.arch }}'
          labels: '${{ steps.meta.outputs.labels }}'
          build-args: 'RESTY_IMAGE_TAG=${{ steps.meta.outputs.version }}'
          provenance: false
          outputs: 'type=image,name=${{ env.BACKEND_IMAGE }},push-by-digest=true,name-canonical=true,push=true'
          cache-from: 'type=gha,scope=defaultbackend-${{ matrix.arch }}'
          cache-to: 'type=gha,mode=max,scope=defaultbackend-${{ matrix.arch }}'
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: 'digests-backend-${{ matrix.arch }}'
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-defaultbackend:
    needs: build-defaultbackend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: 'digests-backend-*'
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'
      - uses: docker/metadata-action@v5
        with:
          images: '${{ env.BACKEND_IMAGE }}'
          tags: '${{ env.META_TAGS }}'
      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${BACKEND_IMAGE}@sha256:%s " *)

  verify:
    needs: [merge-main, merge-defaultbackend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'
      - uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.MAIN_IMAGE }}
            ${{ env.BACKEND_IMAGE }}
          tags: '${{ env.META_TAGS }}'
      - name: Verify platforms
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker buildx imagetools inspect "${tag}"
            docker buildx imagetools inspect --raw "${tag}" |
              jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' > /dev/null
          done < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
