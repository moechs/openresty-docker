<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login</title>

<style>
/* ========== 主题变量 ========== */
:root {
  --bg: #f6f7fb;
  --card: rgba(255, 255, 255, 0.75);
  --text: #1f2937;
  --muted: #6b7280;
  --primary: #2563eb;
  --border: rgba(0,0,0,0.08);
  --shadow: 0 10px 30px rgba(0,0,0,0.08);
}

/* 自动深色模式 */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1220;
    --card: rgba(17, 24, 39, 0.72);
    --text: #e5e7eb;
    --muted: #9ca3af;
    --primary: #60a5fa;
    --border: rgba(255,255,255,0.08);
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
}

/* ========== 基础布局 ========== */
* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at top left, #3b82f6 0%, transparent 35%),
              radial-gradient(circle at bottom right, #8b5cf6 0%, transparent 40%),
              var(--bg);
  color: var(--text);
}

/* ========== 登录卡片 ========== */
.login-container {
  width: 100%;
  max-width: 420px;
  padding: 20px;
}

.card {
  backdrop-filter: blur(14px);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 28px;
}

/* ========== 标题 ========== */
h1 {
  margin: 0 0 6px;
  font-size: 22px;
  font-weight: 700;
}

.subtitle {
  margin: 0 0 24px;
  font-size: 13px;
  color: var(--muted);
}

/* ========== 表单 ========== */
.form-group {
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 13px;
  margin-bottom: 6px;
  color: var(--muted);
}

input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  outline: none;
  background: transparent;
  color: var(--text);
  transition: 0.2s;
}

input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
}

/* ========== 按钮 ========== */
button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: var(--primary);
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
  margin-top: 8px;
}

button:hover {
  opacity: 0.92;
  transform: translateY(-1px);
}

/* ========== 小字提示 ========== */
.footer {
  margin-top: 14px;
  font-size: 12px;
  text-align: center;
  color: var(--muted);
}

/* ========== 响应式优化 ========== */
@media (max-width: 480px) {
  .card {
    padding: 20px;
    border-radius: 12px;
  }
}
</style>
</head>

<body>

<div class="login-container">
  <div class="card">
    <h1>系统登录</h1>
    <p class="subtitle">LDAP 认证访问控制</p>

    <form method="POST" action="/login">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" name="username" autocomplete="username" required />
      </div>

      <div class="form-group">
        <label>密码</label>
        <input type="password" name="password" autocomplete="current-password" required />
      </div>

      <button type="submit">登录</button>
    </form>

    <div class="footer">
      仅授权用户可访问受保护资源
    </div>
  </div>
</div>

</body>
</html>
